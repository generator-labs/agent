name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: alpine:3

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          apk add --no-cache build-base cmake pkgconf git \
            jansson-dev openssl-dev curl-dev util-linux-dev

      - name: Configure
        run: cmake -B build -DBUILD_TESTS=ON -S agent

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

  static-analysis:
    runs-on: ubuntu-latest
    container: alpine:3

    steps:
      - uses: actions/checkout@v5

      - name: Install cppcheck
        run: apk add --no-cache cppcheck

      - name: Run cppcheck
        run: |
          cppcheck --inline-suppr --enable=all \
            -I agent -I agent/lib \
            --suppress=missingIncludeSystem \
            --suppress=missingInclude \
            --suppress=unmatchedSuppression \
            --suppress=unusedFunction \
            --suppress=normalCheckLevelMaxBranches \
            --suppress=checkersReport \
            --error-exitcode=1 \
            agent/
